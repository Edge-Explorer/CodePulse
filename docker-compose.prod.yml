version: '3.8'

services:
  worker:
    build: 
      context: .
      dockerfile: services/worker/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka-consumer:
    build:
      context: .
      dockerfile: services/kafka-consumers/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC=security_scans

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: always

volumes:
  grafana-storage:
